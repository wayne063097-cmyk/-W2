<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數除法大作戰：生活特派員 Pro</title>
    <!-- Tailwind CSS -->

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Fredoka', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                        '3d-amber': '0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.1)',
                        '3d-emerald': '0 6px 0 #059669, 0 10px 15px rgba(0,0,0,0.1)',
                        '3d-sky': '0 6px 0 #0284c7, 0 10px 15px rgba(0,0,0,0.1)',

    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(224, 242, 254, 1) 0%, rgba(240, 249, 255, 1) 90%);
            min-height: 100vh;
            user-select: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px -15px rgba(14, 165, 233, 0.18);
        }

        .btn-3d {
            transition: all 0.15s ease-out;
            position: relative;
            top: 0;
        }
        .btn-3d:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
            font-weight: 800;
        }
        .fraction .top {
            border-bottom: 2px solid currentColor;
            padding-bottom: 1px;
            line-height: 1;
        }
        .fraction .bottom {
            padding-top: 1px;
            line-height: 1;
        }

        .liquid-fill {
            transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;

</head>

    <script>
        // Audio Synthesizer (Web Audio API - No external files needed)
        let soundEnabled = true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) { console.log('Audio error', e); }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            icon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-rose-500';
        }

        // Game State Variables
        let gameMode = 'single';
        let currentStageIndex = 0;
        let score = 0;
        let teams = [];
        let currentTeamIdx = 0;
        let timerInterval = null;
        let secondsPassed = 0;
        let activeTasks = [];
        let interactiveState = {};
        let isPenActive = false;

        // Expanded Rich Task Pool (12 Unique Real-world Scenarios)
        const masterTaskPool = [
            {
                id: 1,
                title: "任務：手搖飲店「一日店長」分裝特派",
                category: "包含除概念與單位換算",
                icon: "fa-solid fa-mug-hot",
                scenarioHTML: `
                    特派員你好！你正在手搖飲料店實習。<br>
                    吧台調配了 <span class="font-black text-amber-700 bg-amber-100 px-2 py-0.5 rounded-lg">2 <span class="fraction"><span class="top">1</span><span class="bottom">2</span></span></span> 公升的黑糖珍奶。<br>
                    如果每 <span class="font-black text-amber-700 bg-amber-100 px-2 py-0.5 rounded-lg"><span class="fraction"><span class="top">1</span><span class="bottom">4</span></span></span> 公升可以裝成 1 小試飲杯：<br><br>
                    👉 <strong>請問總共可以裝滿幾小杯？</strong>
                `,
                correctAnswer: 10,
                explanationHTML: `
                    <strong class="text-sky-800 text-base">💡 觀念解析：</strong><br>
                    • 1 公升裡面包含 <strong>4</strong> 個 <span class="fraction"><span class="top">1</span><span class="bottom">4</span></span> 公升（4 杯）。<br>
                    • 2 公升就有 2 × 4 = <strong>8</strong> 杯。<br>
                    • 剩下的 <span class="fraction"><span class="top">1</span><span class="bottom">2</span></span> 公升可以裝 <strong>2</strong> 杯。<br>
                    • 總共是 8 + 2 = <strong>10 杯</strong>！<br><br>
                    <span class="bg-indigo-50 text-indigo-900 p-2 rounded-xl block font-bold text-xs border border-indigo-200">
                    算式：2<span class="fraction"><span class="top">1</span><span class="bottom">2</span></span> ÷ <span class="fraction"><span class="top">1</span><span class="bottom">4</span></span> = 10。
                    </span>
                `,
                renderPlayground: function(container) {
                    container.innerHTML = `
                        <div class="w-full text-center">
                            <p class="text-xs sm:text-sm font-bold text-slate-700 mb-2">請點擊下方試飲杯進行倒滿，或點擊右上角畫筆直接在圖上畫線劃分：</p>
                            <div class="flex flex-col md:flex-row items-center justify-around gap-4">
                                <div class="bg-white border-2 border-slate-200 rounded-2xl p-3 w-36 shadow-md flex flex-col items-center">
                                    <span class="font-black text-amber-900 text-xs mb-1"><i class="fa-solid fa-jar"></i> 珍奶總容量 (2½L)</span>
                                    <div class="w-full bg-slate-100 border-2 border-slate-300 rounded-xl h-32 relative overflow-hidden flex flex-col-reverse p-1">
                                        <div id="jug-liquid" class="bg-amber-400 border border-amber-500 rounded-lg w-full liquid-fill flex items-center justify-center font-black text-xs text-amber-950" style="height: 100%;">
                                            2½ L
                                        </div>

                renderPlayground: function(container) {

        // Fisher-Yates Shuffle helper to ensure unique and randomized task sets
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame(mode) {
            playSound('click');
            gameMode = mode;
            document.getElementById('mode-badge').innerHTML = mode === 'team' ? 
                '<i class="fa-solid fa-users"></i> 小組合作競賽' : 
                '<i class="fa-solid fa-user"></i> 個人闖關探索';
            
            activeTasks = shuffleArray(masterTaskPool).slice(0, 5);
            initGameplay();
        }

        function showTeamSetup() {
            playSound('click');
            document.getElementById('team-setup').classList.remove('hidden');
        }

        function addTeam() {
            playSound('click');
            const input = document.getElementById('team-name-input');
            const name = input.value.trim();
            if (name) {
                teams.push({ name: name, score: 0 });
                input.value = '';
                renderTeams();
            }
        }

        function renderTeams() {
            const list = document.getElementById('team-list');
            list.innerHTML = teams.map(t => `
                <span class="bg-amber-200 text-amber-950 px-3 py-1 rounded-xl text-xs font-black shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-shield"></i> ${t.name}
                </span>
            `).join('');
        }

        function startTeamBattle() {
            if (teams.length === 0) {
                alert("請至少新增一組隊伍名稱喔！");
                return;
            }
            document.getElementById('team-turn-bar').classList.remove('hidden');
            updateTeamTurnDisplay();
            startGame('team');
        }

        function updateTeamTurnDisplay() {
            if (gameMode === 'team' && teams.length > 0) {
                document.getElementById('current-team-name').innerText = teams[currentTeamIdx].name;
            }
        }

        function nextTeamTurn() {
            playSound('click');
            currentTeamIdx = (currentTeamIdx + 1) % teams.length;
            updateTeamTurnDisplay();
        }

        function initGameplay() {
            document.getElementById('screen-mode-select').classList.add('hidden');
            document.getElementById('screen-gameplay').classList.remove('hidden');
            currentStageIndex = 0;
            score = 0;
            updateScoreDisplay();
            startTimer();
            loadTask(currentStageIndex);
            
            setTimeout(initScratchpadOverlay, 100);
        }

        function startTimer() {
            secondsPassed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsPassed++;
                const mins = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
                const secs = String(secondsPassed % 60).padStart(2, '0');
                document.getElementById('time-spent').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function loadTask(index) {
            const task = activeTasks[index];
            document.getElementById('stage-badge').innerText = `任務 ${index + 1} / ${activeTasks.length}`;
            document.getElementById('task-title').innerText = task.title;
            document.getElementById('task-category').innerText = task.category;
            document.getElementById('scenario-icon').innerHTML = `<i class="${task.icon}"></i>`;
            document.getElementById('scenario-text').innerHTML = task.scenarioHTML;
            document.getElementById('user-answer-input').value = '';

            const container = document.getElementById('interactive-playground');
            task.renderPlayground(container);

            // Clear drawing board on task change
            clearCanvas();
        }

        function checkAnswer() {
            const task = activeTasks[currentStageIndex];
            const userAns = parseFloat(document.getElementById('user-answer-input').value);

            if (isNaN(userAns)) {
                alert("請先輸入數字答案喔！");
                return;
            }

            const isCorrect = Math.abs(userAns - task.correctAnswer) < 0.01;

            const modal = document.getElementById('feedback-modal');
            const modalIcon = document.getElementById('feedback-icon');
            const modalTitle = document.getElementById('feedback-title');
            const modalBody = document.getElementById('feedback-body');

            if (isCorrect) {
                playSound('correct');
                score += 100;
                if (gameMode === 'team') {
                    teams[currentTeamIdx].score += 100;
                }
                updateScoreDisplay();

                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                modalIcon.className = "w-20 h-20 rounded-3xl flex items-center justify-center text-4xl mb-4 bg-emerald-100 text-emerald-600 shadow-inner";
                modalIcon.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
                modalTitle.innerText = "完全正確！概念超清晰！ 🎉";
            } else {
                playSound('wrong');
                modalIcon.className = "w-20 h-20 rounded-3xl flex items-center justify-center text-4xl mb-4 bg-rose-100 text-rose-600 shadow-inner";
                modalIcon.innerHTML = `<i class="fa-solid fa-circle-xmark"></i>`;
                modalTitle.innerText = "再思考看看喔！ 🤔";
            }

            modalBody.innerHTML = task.explanationHTML;
            modal.classList.remove('hidden');
        }

        function closeModalAndNext() {
            playSound('click');
            document.getElementById('feedback-modal').classList.add('hidden');
            currentStageIndex++;
            if (gameMode === 'team') {
                nextTeamTurn();
            }

            if (currentStageIndex < activeTasks.length) {
                loadTask(currentStageIndex);
            } else {
                finishGame();
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = score;
        }

        function finishGame() {
            clearInterval(timerInterval);
            document.getElementById('screen-gameplay').classList.add('hidden');
            document.getElementById('screen-summary').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            const teamRankContainer = document.getElementById('team-results-rank');
            if (gameMode === 'team' && teams.length > 0) {
                teamRankContainer.classList.remove('hidden');
                teams.sort((a, b) => b.score - a.score);
                teamRankContainer.innerHTML = `
                    <h4 class="font-extrabold text-sky-900 mb-2 text-xs uppercase tracking-wider">🏆 戰隊排行榜：</h4>
                    ${teams.map((t, idx) => `
                        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-sky-200/80 shadow-sm">
                            <span class="font-bold text-slate-700 text-sm">${idx + 1}. ${t.name}</span>
                            <span class="font-black text-amber-600 text-sm">${t.score} 分</span>
                        </div>
                    `).join('')}
                `;
            } else {
                teamRankContainer.classList.add('hidden');
            }

            confetti({
                particleCount: 180,
                spread: 100,
                origin: { y: 0.4 }
            });
        }

        function resetGame() {
            playSound('click');
            currentStageIndex = 0;
            score = 0;
            teams = [];
            currentTeamIdx = 0;
            document.getElementById('team-list').innerHTML = '';
            document.getElementById('team-setup').classList.add('hidden');
            document.getElementById('team-turn-bar').classList.add('hidden');
            document.getElementById('screen-summary').classList.add('hidden');
            document.getElementById('screen-mode-select').classList.remove('hidden');
        }

        // Overlay Drawing Canvas logic (Directly covering the entire playground area)
        let canvas, ctx, drawing = false, canvasColor = '#ef4444';

        function togglePenMode() {
            playSound('click');
            isPenActive = !isPenActive;
            const btnText = document.getElementById('pen-btn-text');
            const tools = document.getElementById('pen-color-tools');
            const overlay = document.getElementById('scratchpad-overlay');

            if (isPenActive) {
                btnText.innerText = "關閉畫筆 (切換互動)";
                tools.classList.remove('hidden');
                overlay.classList.remove('pointer-events-none');
                overlay.classList.add('pointer-events-auto');
            } else {
                btnText.innerText = "啟動畫筆草稿";
                tools.classList.add('hidden');
                overlay.classList.add('pointer-events-none');
                overlay.classList.remove('pointer-events-auto');
            }
        }

        function initScratchpadOverlay() {
            canvas = document.getElementById('scratchpad-overlay');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            
            const resizeCanvas = () => {
                const wrapper = document.getElementById('playground-wrapper');
                if (wrapper) {
                    canvas.width = wrapper.clientWidth;
                    canvas.height = wrapper.clientHeight;
                }
            };

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const getPos = (e) => {
                const r = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - r.left,
                    y: clientY - r.top
                };
            };

            const startDraw = (e) => {
                if (!isPenActive) return;
                e.preventDefault();
                drawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!drawing || !isPenActive) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.strokeStyle = canvasColor;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDraw = (e) => {
                if (drawing) {
                    e.preventDefault();
                    drawing = false;
                }
            };

            canvas.addEventListener('mousedown', startDraw, { passive: false });
            canvas.addEventListener('mousemove', draw, { passive: false });
            window.addEventListener('mouseup', stopDraw, { passive: false });

            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            window.addEventListener('touchend', stopDraw, { passive: false });
        }

        function setCanvasColor(color) { canvasColor = color; }
        function clearCanvas() { 
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
            }
        }
    </script>
</body>
